name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag must be present for go build to stamp the version
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        # Outside the checkout: untracked files would stamp the version as +dirty.
        run: |
          repo=$PWD dist=$RUNNER_TEMP/dist
          mkdir "$dist"
          cd "$RUNNER_TEMP"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name=mekiki_${GITHUB_REF_NAME}_${os}_${arch}
            exe=mekiki; [ "$os" = windows ] && exe=mekiki.exe
            mkdir "$name"
            (cd "$repo" && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags=-s -o "$RUNNER_TEMP/$name/$exe" .)
            cp "$repo/LICENSE" "$repo/README.md" "$name/"
            if [ "$os" = windows ]; then zip -qr "$dist/$name.zip" "$name"; else tar czf "$dist/$name.tar.gz" "$name"; fi
          done
          cd "$dist" && sha256sum -- * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --verify-tag --generate-notes
